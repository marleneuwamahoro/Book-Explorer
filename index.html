<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- HEADER -->
<header class="bg-white shadow-md">
  <nav class="p-4 flex justify-between items-center">

    <h1 class="text-xl font-bold text-blue-600">Book Explorer</h1>

    <button id="menu-btn" class="md:hidden text-3xl">☰</button>

    <ul id="menu"
        class="hidden md:flex flex-col md:flex-row gap-4 md:gap-6 text-gray-700
               absolute md:static top-16 left-0 w-full md:w-auto bg-white md:bg-transparent
               shadow-md md:shadow-none p-4 md:p-0">

      <li><a href="index.html" class="hover:text-blue-500">Home</a></li>
      <li><a href="favorites.html" class="hover:text-blue-500">Favorites</a></li>
      <li><a href="#" class="hover:text-blue-500">About</a></li>

    </ul>

  </nav>
</header>


<!-- HERO -->
<section class="text-center py-20 px-6">
  <h2 class="text-4xl font-bold text-gray-800 mb-4">
    Discover Your Next Favorite Book 📚
  </h2>

  <p class="text-gray-600 mb-6">
    Explore books from different authors and genres.
  </p>

  <button class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
    Start Exploring
  </button>
</section>


<!-- BOOKS CONTAINER (DYNAMIC) -->
<section class="p-6">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">
    Featured Books
  </h2>

  <div id="books-container"
       class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
  </div>
</section>


<!-- FOOTER -->
<footer class="bg-white text-center p-4 mt-10 text-gray-500">
  © 2026 Book Explorer. All rights reserved.
</footer>


<script type="module" src="js/script.js"></script>

</body>
</html>
