<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Book Explorer</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <!-- <header class="bg-gray-800 p-4"> -->
    <header class="bg-gray-800 p-4 fixed top-0 left-0 w-full z-50 shadow-lg">
      

    <div class="max-w-7xl mx-auto flex justify-between items-center">

      <!-- LOGO -->
      <h1 class="text-2xl font-bold text-blue-400">
        📚 Book Explorer
      </h1>

      <!-- MOBILE BUTTON -->
      <button
        id="menu-btn"
        class="md:hidden text-3xl"
      >
        ☰
      </button>

      <!-- DESKTOP MENU -->
      <nav class="hidden md:flex gap-6">

        <a
          href="index.html"
          class="text-blue-400 font-semibold"
        >
          Home
        </a>

        <a
          href="favorites.html"
          class="hover:text-blue-400 transition"
        >
          Favorites
        </a>

        <a
          href="about.html"
          class="hover:text-blue-400 transition"
        >
          About
        </a>

      </nav>

    </div>

    <!-- MOBILE MENU -->
    <nav
      id="mobile-menu"
      class="hidden md:hidden flex flex-col gap-4 mt-4 px-4"
    >

      <a
        href="index.html"
        class="text-blue-400 font-semibold"
      >
        Home
      </a>

      <a
        href="favorites.html"
        class="hover:text-blue-400"
      >
        Favorites
      </a>

      <a
        href="about.html"
        class="hover:text-blue-400"
      >
        About
      </a>

    </nav>

  </header>

  <!-- HERO -->
  <section class="text-center py-10 sm:py-16 px-4">

    <h2 class="text-3xl sm:text-5xl font-bold mb-4">
      Discover Amazing Books 📖
    </h2>

    <p class="text-gray-400 max-w-2xl mx-auto">
      Search books and save your favorites.
    </p>

  </section>

  <!-- SEARCH -->
  <section class="max-w-4xl mx-auto px-4 mb-10 w-full">

    <div class="flex flex-col sm:flex-row gap-4">

      <input
        id="search-input"
        type="text"
        placeholder="Search books..."
        class="flex-1 p-3 rounded-lg bg-gray-800 border border-gray-700 outline-none"
      />

      <button
        id="search-btn"
        class="bg-blue-500 px-6 py-3 rounded-lg hover:bg-blue-600 transition"
      >
        Search
      </button>

    </div>

  </section>

  <!-- MESSAGE -->
  <div
    id="message"
    class="text-center text-gray-400 mb-6"
  ></div>

  <!-- BOOK GRID -->
  <section
    id="books-container"
    class="max-w-7xl mx-auto px-4 pb-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full"
  >

  </section>
  <!-- SCROLL TOP -->
<button
  id="scroll-top"
  class="fixed bottom-5 left-5 bg-blue-500 w-12 h-12 rounded-full hidden hover:bg-blue-600 transition"
>
  ↑
</button>

<!-- TOAST -->
<div
  id="toast"
  class="fixed bottom-5 right-5 bg-blue-500 text-white px-6 py-3 rounded-lg shadow-lg hidden"
>
</div>

  <!-- FOOTER -->
  <footer class="bg-gray-800 text-center py-6 mt-auto">

    <div class="max-w-7xl mx-auto px-4">

      <p class="text-gray-400 mb-2">
        © 2026 Book Explorer
      </p>

      <p class="text-sm text-gray-500">
        Built with HTML, Tailwind CSS & JavaScript
      </p>

    </div>

  </footer>

  <script
    type="module"
    src="js/script.js"
  ></script>

</body>
</html>
